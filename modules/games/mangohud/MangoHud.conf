# MangoHud Configuration File
# Performance monitoring
fps
frametime=1
cpu_stats
gpu_stats
cpu_temp
gpu_temp
cpu_power
gpu_power
ram
vram

# Display settings
position=top-left
background_alpha=0.4
font_size=24

# Layout and appearance
horizontal
text_color=FFFFFF
gpu_color=2E9762
cpu_color=2E97CB
vram_color=AD64C1
ram_color=C26693
engine_color=EB5B5B
io_color=A491D3
frametime_color=00FF00
background_color=020202
round_corners=5

# Controls
toggle_logging=Shift_L+F2
toggle_hud=Shift_R+F12

# Logging
output_folder=$HOME/.local/share/MangoHud/
log_duration=30
