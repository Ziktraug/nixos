# Hyprland Configuration
# Complete desktop environment setup

# Environment variables are set globally in NixOS configuration

# ============================================================================
# MONITOR CONFIGURATION
# ============================================================================
# Left monitor (vertical)
monitor = HDMI-A-2, 1920x1080@60, 0x0, 1, transform, 1

# Center monitor (4K OLED primary, no scaling for full 4K)
monitor = DP-3, 3840x2160@60, 1080x0, 1

# Right monitor (horizontal, vertically centered)
monitor = HDMI-A-1, 1920x1080@60, 4920x540, 1

# Fallback for any other monitors
monitor = , preferred, auto, 1

# ============================================================================
# AUTOSTART
# ============================================================================
# DBus environment - CRITICAL for gnome-keyring and Secret Service API
# This must run early to allow browsers to access the keyring
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Start gnome-keyring-daemon (PAM should have unlocked it, this ensures components are running)
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh

# Desktop components
exec-once = GDK_BACKEND=wayland waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle

# XDG autostart entries (ProtonVPN, etc.)
exec-once = dex --autostart --environment Hyprland

# Set primary monitor for XWayland games (fixes resolution issues)
# See: https://wiki.hypr.land/FAQ/
exec-once = xrandr --output DP-3 --primary

# Set solid color background (fallback if hyprpaper has no wallpaper)
exec-once = hyprctl hyprpaper unload all
exec = hyprctl setcursor Bibata-Modern-Classic 24

# ============================================================================
# INPUT CONFIGURATION
# ============================================================================
input {
    kb_layout = fr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true

    follow_mouse = 1
    off_window_axis_events = 3
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

# ============================================================================
# CURSOR CONFIGURATION
# ============================================================================
cursor {
    no_warps = true
}


# ============================================================================
# GENERAL APPEARANCE
# ============================================================================
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Catppuccin Mocha colors (Mauve accent)
    col.active_border = rgba(cba6f7ee) rgba(b4befeee) 45deg
    col.inactive_border = rgba(313244aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# ============================================================================
# DECORATION
# ============================================================================
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a1aee)
        offset = 0 2
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.0117
        contrast = 0.8916
        brightness = 0.8172
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
    }
}

# ============================================================================
# ANIMATIONS
# ============================================================================
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, myBezier, slide
    animation = windowsOut, 1, 5, smoothOut, slide
    animation = windowsMove, 1, 4, default
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default, slide
}

# ============================================================================
# LAYOUTS
# ============================================================================
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
    new_on_top = false
}

# ============================================================================
# WINDOW RULES
# ============================================================================
windowrulev2 = suppressevent maximize, class:.*

# Audio control
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$

# File manager dialogs
windowrulev2 = float, class:^(org.gnome.Nautilus)$, title:^(.*Progress)$
windowrulev2 = center, class:^(org.gnome.Nautilus)$, title:^(.*Progress)$

# Picture-in-Picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$

# Terminal opacity
windowrulev2 = opacity 0.95 0.85, class:^(ghostty)$

# Dialog and popup windows - center them to ensure visibility
windowrulev2 = float, title:^(.*[Dd]ialog.*)$
windowrulev2 = center, title:^(.*[Dd]ialog.*)$
windowrulev2 = float, title:^(.*[Ww]arning.*)$
windowrulev2 = center, title:^(.*[Ww]arning.*)$
windowrulev2 = float, title:^(.*[Ee]rror.*)$
windowrulev2 = center, title:^(.*[Ee]rror.*)$
windowrulev2 = float, title:^(.*[Cc]onfirm.*)$
windowrulev2 = center, title:^(.*[Cc]onfirm.*)$

# Generic dialog types
windowrulev2 = float, class:^(.*[Dd]ialog.*)$
windowrulev2 = center, class:^(.*[Dd]ialog.*)$

# File chooser dialogs
windowrulev2 = float, title:^(Open File)$
windowrulev2 = center, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = center, title:^(Save File)$
windowrulev2 = float, title:^(Select a File)$
windowrulev2 = center, title:^(Select a File)$

# ============================================================================
# GAMING WINDOW RULES
# ============================================================================
# Gamescope - for enhanced game compatibility
windowrulev2 = fullscreen, class:^(gamescope)$
windowrulev2 = immediate, class:^(gamescope)$
windowrulev2 = noborder, class:^(gamescope)$
windowrulev2 = noshadow, class:^(gamescope)$

# Steam games (generic Wine/Proton)
windowrulev2 = immediate, class:^(steam_app_.*)$
windowrulev2 = fullscreen, class:^(steam_app_.*)$, fullscreen:0

# Wine/Proton games - allow tearing for reduced input lag
windowrulev2 = immediate, class:^(.*\.exe)$

# ============================================================================
# KEYBINDINGS
# ============================================================================
$mainMod = SUPER

# Essential bindings
bind = $mainMod, Q, exec, ghostty
bind = $mainMod, C, killactive
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo
bind = $mainMod, T, togglesplit

# App launcher (Alt + Space as requested)
bind = ALT, Space, exec, rofi -show drun

# Screenshot utilities
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, F, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# Lock screen
bind = $mainMod, L, exec, loginctl lock-session

# Volume controls
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness controls
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Focus movement (Vim-style)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Focus movement (Arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows (Vim-style)
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Move windows (Arrow keys)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize windows (Vim-style)
bind = $mainMod CTRL, h, resizeactive, -50 0
bind = $mainMod CTRL, l, resizeactive, 50 0
bind = $mainMod CTRL, k, resizeactive, 0 -50
bind = $mainMod CTRL, j, resizeactive, 0 50

# Resize windows (Arrow keys)
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50

# Switch workspaces (using F1-F10 for French keyboard compatibility)
bind = $mainMod, F1, workspace, 1
bind = $mainMod, F2, workspace, 2
bind = $mainMod, F3, workspace, 3
bind = $mainMod, F4, workspace, 4
bind = $mainMod, F5, workspace, 5
bind = $mainMod, F6, workspace, 6
bind = $mainMod, F7, workspace, 7
bind = $mainMod, F8, workspace, 8
bind = $mainMod, F9, workspace, 9
bind = $mainMod, F10, workspace, 10

# Move window to workspace (using F1-F10 for French keyboard compatibility)
bind = $mainMod SHIFT, F1, movetoworkspace, 1
bind = $mainMod SHIFT, F2, movetoworkspace, 2
bind = $mainMod SHIFT, F3, movetoworkspace, 3
bind = $mainMod SHIFT, F4, movetoworkspace, 4
bind = $mainMod SHIFT, F5, movetoworkspace, 5
bind = $mainMod SHIFT, F6, movetoworkspace, 6
bind = $mainMod SHIFT, F7, movetoworkspace, 7
bind = $mainMod SHIFT, F8, movetoworkspace, 8
bind = $mainMod SHIFT, F9, movetoworkspace, 9
bind = $mainMod SHIFT, F10, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Special workspace (scratchpad)
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# ============================================================================
# GAMING MODE (SUPER+G toggles secondary monitors off/on)
# ============================================================================
# This prevents cursor from escaping to other monitors during gaming
# See: https://github.com/hyprwm/Hyprland/issues/2376
# Press SUPER+G to enter gaming mode (disables side monitors)
# Press SUPER+G again to exit gaming mode (re-enables side monitors)
bind = $mainMod, G, exec, /run/current-system/sw/bin/bash ~/.config/hypr/scripts/toggle-gaming-mode.sh

# ============================================================================
# MISC SETTINGS
# ============================================================================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}
