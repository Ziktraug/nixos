# Hypridle configuration

general {
    lock_cmd = pidof hyprlock || hyprlock       # lock screen command
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # wake up displays after resume
}

# Dim screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%       # save and dim to 10%
    on-resume = brightnessctl -r                # restore previous brightness
}

# Lock screen after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = loginctl lock-session          # lock session
}

# Turn off displays after 15 minutes of inactivity
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off      # turn off displays
    on-resume = hyprctl dispatch dpms on        # turn on displays
}

