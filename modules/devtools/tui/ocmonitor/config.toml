[paths]
# OpenCode 2 preview is the default. Use `ocmonitor-v1` for the stable database.
database_file = "~/.local/share/opencode/opencode-next.db"
messages_dir = "~/.local/share/opencode/storage/message"
export_dir = "~/.local/share/ocmonitor/exports"

[ui]
table_style = "rich"
progress_bars = true
colors = true

[export]
default_format = "csv"
include_metadata = true
